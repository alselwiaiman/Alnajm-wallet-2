<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#183883"/>
      <stop offset="100%" stop-color="#0F2356"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(250, 150)" filter="url(#subtleShadow)">
    <!-- Base Outer Blue Circle -->
    <circle cx="0" cy="0" r="100" fill="url(#blueGrad)" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Left Inward Arrow / Chevron -->
    <polygon points="-115,-20 -80,0 -115,20 -100,0" fill="#FFFFFF"/>
    <polyline points="-115,-20 -80,0 -115,20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stylized Central Monogram (Frame & S curve) -->
    <!-- Vertical Frame Columns -->
    <rect x="-18" y="-62" width="12" height="124" rx="2" fill="#FFFFFF"/>
    <rect x="6" y="-62" width="12" height="124" rx="2" fill="#FFFFFF"/>
    
    <!-- Horizontal Crossbars -->
    <rect x="-18" y="-62" width="36" height="11" fill="#FFFFFF"/>
    <rect x="-18" y="-22" width="36" height="11" fill="#FFFFFF"/>
    <rect x="-18" y="16" width="36" height="11" fill="#FFFFFF"/>
    <rect x="-18" y="51" width="36" height="11" fill="#FFFFFF"/>

    <!-- Overlaying Stylized S Curve -->
    <path d="M 28 -38 C 28 -55, -28 -55, -28 -32 C -28 -12, 28 -12, 28 8 C 28 35, -28 35, -28 15" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: Arabic Brand Name -->
  <text x="250" y="305" text-anchor="middle" font-family="'Cairo', 'Tajawal', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34" fill="#183883" letter-spacing="1">
    شركة الصيفي للصرافة
  </text>

  <!-- Typography: English Brand Name -->
  <text x="250" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" fill="#183883" letter-spacing="3">
    AL-SAIFI CO. FOR EXCHANGE
  </text>

  <!-- Divider line -->
  <line x1="150" y1="365" x2="350" y2="365" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Customer Support Hotline -->
  <text x="250" y="398" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="18" fill="#1E3A8A">
    الرقم المجاني
  </text>
  <text x="250" y="435" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="30" fill="#DC2626" font-style="italic" letter-spacing="2">
    8000002
  </text>
</svg>
