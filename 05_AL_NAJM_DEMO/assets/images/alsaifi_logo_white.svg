<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(250, 150)">
    <circle cx="0" cy="0" r="100" fill="url(#blueGradWhite)" stroke="#60A5FA" stroke-width="3"/>
    
    <!-- Left Chevron -->
    <polygon points="-115,-20 -80,0 -115,20 -100,0" fill="#FFFFFF"/>
    <polyline points="-115,-20 -80,0 -115,20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Columns -->
    <rect x="-18" y="-62" width="12" height="124" rx="2" fill="#FFFFFF"/>
    <rect x="6" y="-62" width="12" height="124" rx="2" fill="#FFFFFF"/>
    
    <!-- Crossbars -->
    <rect x="-18" y="-62" width="36" height="11" fill="#FFFFFF"/>
    <rect x="-18" y="-22" width="36" height="11" fill="#FFFFFF"/>
    <rect x="-18" y="16" width="36" height="11" fill="#FFFFFF"/>
    <rect x="-18" y="51" width="36" height="11" fill="#FFFFFF"/>

    <!-- S Curve -->
    <path d="M 28 -38 C 28 -55, -28 -55, -28 -32 C -28 -12, 28 -12, 28 8 C 28 35, -28 35, -28 15" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- White Typography for Dark Backgrounds -->
  <text x="250" y="305" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">
    شركة الصيفي للصرافة
  </text>

  <text x="250" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" fill="#93C5FD" letter-spacing="3">
    AL-SAIFI CO. FOR EXCHANGE
  </text>

  <line x1="150" y1="365" x2="350" y2="365" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <text x="250" y="398" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="18" fill="#E2E8F0">
    الرقم المجاني
  </text>
  <text x="250" y="435" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="30" fill="#EF4444" font-style="italic" letter-spacing="2">
    8000002
  </text>
</svg>
